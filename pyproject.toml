[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegdetect-py"
version = "0.1.0"
description = "Python port of Niels Provos' stegdetect / stegbreak JPEG steganography detector and cracker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "stegdetect-py port" }]
keywords = ["steganography", "steganalysis", "jpeg", "jsteg", "outguess", "jphide", "f5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "build", "twine"]

[project.scripts]
stegdetect = "stegdetect_py.cli:main"
stegbreak = "stegdetect_py.stegbreak:main"
stegcompare = "stegdetect_py.stegcompare:main"

[project.urls]
Homepage = "https://github.com/abeluck/stegdetect"
Repository = "https://github.com/abeluck/stegdetect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stegdetect_py = ["py.typed", "stegbreak.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
